<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0B0F0A" />

    <!-- ================================================================
         Search-optimised meta (PR #30)

         `description` is what Google shows under the blue title in
         search results. Written to work as a self-contained snippet
         for someone who's Googled "KasiKash" or a related term. The
         four SA languages are named explicitly so language-scoped
         searches surface us.
         ================================================================ -->
    <meta name="description" content="Voice-first finance for South African informal businesses. Log sales, run stokvels, build a Financial Passport that lenders trust. isiZulu, Sesotho, Afrikaans, English." />
    <meta name="keywords" content="informal business finance, spaza shop app, stokvel management, KasiScore, financial passport, South Africa SME credit, voice logging isiZulu, township business" />
    <meta name="author" content="Sinethemba Mvelase" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Canonical URL: tells search engines and link-preview services
         (WhatsApp, Twitter, Facebook, LinkedIn) which URL to treat as
         the source of truth even if the user landed via a share link,
         a preview build, or a legacy Vercel URL. -->
    <link rel="canonical" href="https://kasikash.com/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KasiKash" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Social preview / Open Graph.
         WhatsApp, Twitter, Facebook, LinkedIn all read these tags to
         render the rich card that shows up when someone shares a
         KasiKash invite link in a chat. Absolute URLs are important —
         WhatsApp will silently drop a relative `og:image` path.
         Using kasikash.com (the canonical domain) rather than the
         Vercel URL so previews stay stable across deploys. -->
    <meta property="og:site_name" content="KasiKash" />
    <meta property="og:title" content="KasiKash — A credit passport for informal SMEs" />
    <meta property="og:description" content="Voice-first finance for South Africa's informal small businesses. Log sales, run stokvels, build a Financial Passport lenders trust." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kasikash.com/" />
    <meta property="og:image" content="https://kasikash.com/icon.svg" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card — kept summary (not summary_large_image) because
         we currently only have an SVG icon, not a wide banner. If a
         wide PNG banner is added later, upgrade this to
         summary_large_image and add a matching twitter:image. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KasiKash — A credit passport for informal SMEs" />
    <meta name="twitter:description" content="Voice-first finance for South Africa's informal small businesses." />
    <meta name="twitter:image" content="https://kasikash.com/icon.svg" />

    <title>KasiKash — A credit passport for informal SMEs in South Africa</title>

    <!-- ================================================================
         Structured data (JSON-LD) — PR #30

         These blocks tell Google (and Bing, and DuckDuckGo, and every
         other crawler that respects schema.org) what KasiKash IS.
         Rendered directly in <head> as static JSON so a crawler
         doesn't need to execute JavaScript to see them — critical for
         reliable indexing of a client-rendered SPA.

         Three schemas:
           1. SoftwareApplication  → search treats KasiKash as an app
                                     rather than a generic website
           2. Organization         → feeds the Knowledge Panel (right-
                                     hand info card) once Google
                                     recognises us as an entity
           3. FAQPage              → expandable Q&A rows underneath
                                     the main search result

         Copy is kept in-sync with the visible Landing page copy.
         Google penalises inconsistency between structured data and
         page content — see the visible FAQ section in Landing.tsx.
         ================================================================ -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "KasiKash",
      "alternateName": "KasiKash Financial Passport",
      "url": "https://kasikash.com/",
      "installUrl": "https://kasikash.com/app/",
      "applicationCategory": "FinanceApplication",
      "applicationSubCategory": "Small Business Finance",
      "operatingSystem": "Web, iOS, Android",
      "description": "Voice-first finance for South Africa's informal small businesses. KasiKash turns cash sales, customer tabs, and stokvel contributions into a Financial Passport that formal lenders can trust.",
      "image": "https://kasikash.com/icon.svg",
      "screenshot": "https://kasikash.com/icon.svg",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "ZAR",
        "availability": "https://schema.org/InStock"
      },
      "publisher": {
        "@type": "Organization",
        "name": "KasiKash",
        "url": "https://kasikash.com/"
      },
      "inLanguage": ["en", "zu", "st", "af"],
      "featureList": [
        "Voice-first sales logging in four SA languages",
        "Bank statement PDF / CSV parsing (local, private)",
        "Stokvel management with contribution tracking",
        "Customer tab tracking and repayment history",
        "Financial Passport for informal-SME credit access",
        "KasiScore credit signal (300-850 scale)",
        "Receipt scanning for supplier expenses",
        "Works offline; syncs when back online"
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "Informal small business owners",
        "geographicArea": {
          "@type": "Country",
          "name": "South Africa"
        }
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KasiKash",
      "alternateName": "KasiKash Financial",
      "url": "https://kasikash.com/",
      "logo": "https://kasikash.com/icon.svg",
      "description": "A credit passport for South Africa's informal small businesses. Voice-first, evidence-tiered financial identity for the businesses banks can't see.",
      "slogan": "A credit passport for the businesses banks can't see.",
      "founder": {
        "@type": "Person",
        "name": "Sinethemba Mvelase",
        "jobTitle": "Founder"
      },
      "foundingLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "ZA"
        }
      },
      "areaServed": {
        "@type": "Country",
        "name": "South Africa"
      },
      "knowsAbout": [
        "Financial inclusion",
        "Informal economy underwriting",
        "Township small business finance",
        "Alternative credit scoring",
        "Stokvel management",
        "Voice-first mobile apps",
        "Multi-language fintech (isiZulu, Sesotho, Afrikaans)"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@kasikash.com",
        "contactType": "Customer Support",
        "availableLanguage": ["en", "zu", "st", "af"]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is KasiKash?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KasiKash is a voice-first finance app for South Africa's informal small businesses — spaza shops, hair salons, taxi ranks, kasi hustles. It turns cash sales, customer tabs, bank activity, and stokvel contributions into a Financial Passport that formal lenders can trust."
          }
        },
        {
          "@type": "Question",
          "name": "How does the KasiScore work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The KasiScore is a 300-850 credit signal built transparently from three tiers of evidence: declared (self-reported sales), observed (bank statement inflows, receipts), and verified (Yoco transactions, confirmed stokvel contributions). Each tier has a different weight, so a Yoco-verified R100 sale counts about five times more than a voice-logged R100 cash sale. Every factor is auditable and explained inside the app."
          }
        },
        {
          "@type": "Question",
          "name": "Is KasiKash free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. KasiKash is free forever for spaza owners, informal traders, and stokvel members. We monetize by selling credit intelligence to lenders — never by charging the small businesses using the app."
          }
        },
        {
          "@type": "Question",
          "name": "Who is KasiKash for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KasiKash is for South African informal businesses that trade mostly in cash and have never been able to prove their income to a formal lender. Spaza shops, hair salons, phone-repair guys, taxi ranks, corner traders, kasi hustles — and the stokvels those business owners participate in."
          }
        },
        {
          "@type": "Question",
          "name": "What languages does KasiKash support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KasiKash supports four South African languages: isiZulu, Sesotho, Afrikaans, and English. Voice logging works in all four so you can say things like 'R50 for bread' in whichever language feels natural."
          }
        },
        {
          "@type": "Question",
          "name": "Is my business data safe with KasiKash?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Bank statement PDFs are parsed locally on your phone — the file itself never leaves your device. Only extracted transaction data is stored, protected by row-level security so only you can read your own records. Your Financial Passport belongs to you and is portable across lenders."
          }
        },
        {
          "@type": "Question",
          "name": "Does KasiKash work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Sales you log while offline are queued on your phone and sync automatically the next time you're online. Designed for the reality of intermittent kasi mobile connectivity."
          }
        },
        {
          "@type": "Question",
          "name": "How is KasiKash different from apps like Flash, Shop2Shop, or Lesaka?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Flash, Shop2Shop, and Lesaka are transaction infrastructure — they move money for informal businesses. KasiKash is credit infrastructure. We build the financial identity that turns transactions from any of those platforms (plus voice-logged cash sales, bank statements, and stokvel discipline) into an underwritable credit passport a lender can act on. We can partner with all of them, not compete."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
