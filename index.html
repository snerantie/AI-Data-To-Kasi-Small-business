<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0B0F0A" />

    <!-- ================================================================
         Search-optimised meta (PR #30, tightened in PR #33, refocused
         on stokvels + mashonisa in PR #40)

         `description` is what Google shows under the blue title in
         search results. Held under ~155 characters (the mobile
         truncation point) so it never cuts mid-sentence.

         Google sometimes picks the FAQ text over this meta —
         especially for a very new domain with rich structured data.
         The FAQ #1 answer below is ALSO kept under the truncation
         limit for the same reason: whichever Google picks, viewers
         see a complete thought.
         ================================================================ -->
    <meta name="description" content="Money tools for South Africa's stokvels and mashonisa — manage contributions, payouts and loans, and build a credit passport that lenders trust." />
    <meta name="keywords" content="stokvel app, stokvel management, burial society app, savings group, mashonisa app, informal lending, credit passport, KasiScore, financial inclusion South Africa, township finance" />
    <meta name="author" content="Sinethemba Mvelase" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!-- Canonical URL: tells search engines and link-preview services
         (WhatsApp, Twitter, Facebook, LinkedIn) which URL to treat as
         the source of truth even if the user landed via a share link,
         a preview build, or a legacy Vercel URL. -->
    <link rel="canonical" href="https://kasikash.com/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ================================================================
         Favicons — PR #33 fix

         Google's search-result favicon slot requires PNG / ICO / JPG.
         SVG is NOT reliably rendered there (documented at
         https://developers.google.com/search/docs/appearance/favicon-in-search).
         Symptom: our search result was showing Google's generic
         globe icon instead of the K monogram.

         Fix: reference the existing 400x400 PNG (produced by the
         brand render pipeline in PR #31) as an alternate icon.
         Modern browsers still prefer the sharper SVG because it
         appears first; Google Search + Slack + Discord + Twitter
         unfurls all fall through to the PNG.

         Sizes attribute lets user agents pick the closest match to
         the display slot (browser tab: 16-32px, phone home screen:
         180-192px, search result: 48px). Providing "any" on the
         SVG signals "this vector scales to any size".
         ================================================================ -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="400x400" href="/og/kasikash-logo-400.png" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/og/kasikash-logo-1024.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/og/kasikash-logo-400.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KasiKash" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Social preview / Open Graph.
         WhatsApp, Twitter, Facebook, LinkedIn all read these tags to
         render the rich card that shows up when someone shares a
         KasiKash invite link in a chat. Absolute URLs are important —
         WhatsApp will silently drop a relative `og:image` path.
         Using kasikash.com (the canonical domain) rather than the
         Vercel URL so previews stay stable across deploys. -->
    <meta property="og:site_name" content="KasiKash" />
    <meta property="og:title" content="KasiKash — Stokvel & mashonisa money app + credit passport" />
    <meta property="og:description" content="Money tools for South Africa's stokvels and mashonisa. Run contributions, payouts and loans — and build a credit passport that lenders trust." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kasikash.com/" />
    <!-- PR #33: prefer the PNG logo asset over the SVG for
         WhatsApp / LinkedIn / X previews. Same reason as the
         favicon fix: many social platforms drop or misrender SVG
         when generating link-preview cards. The 1024x1024 PNG is
         well above the 400x400 minimum most platforms require. -->
    <meta property="og:image" content="https://kasikash.com/og/kasikash-logo-1024.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="KasiKash logo — K monogram on a green tile" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card — kept summary (not summary_large_image) because
         we currently only have a square icon, not a wide banner. If
         a wide PNG hero is added later, upgrade this to
         summary_large_image and add a matching wide twitter:image. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KasiKash — Stokvel & mashonisa money app + credit passport" />
    <meta name="twitter:description" content="Money tools for South Africa's stokvels and mashonisa lenders — and a credit passport their track record earns." />
    <meta name="twitter:image" content="https://kasikash.com/og/kasikash-logo-1024.png" />

    <title>KasiKash — Stokvel & mashonisa money app + credit passport (South Africa)</title>

    <!-- ================================================================
         Structured data (JSON-LD) — PR #30, refocused in PR #40

         These blocks tell Google (and Bing, and DuckDuckGo, and every
         other crawler that respects schema.org) what KasiKash IS.
         Rendered directly in <head> as static JSON so a crawler
         doesn't need to execute JavaScript to see them — critical for
         reliable indexing of a client-rendered SPA.

         Three schemas:
           1. SoftwareApplication  → search treats KasiKash as an app
                                     rather than a generic website
           2. Organization         → feeds the Knowledge Panel (right-
                                     hand info card) once Google
                                     recognises us as an entity
           3. FAQPage              → expandable Q&A rows underneath
                                     the main search result

         Copy leads with the stokvel + mashonisa focus (the food /
         business service is shelved). The credit-passport + KasiScore
         thesis is unchanged — it now draws evidence from saving and
         repayment discipline rather than shop sales.
         ================================================================ -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "KasiKash",
      "alternateName": "KasiKash Financial Passport",
      "url": "https://kasikash.com/",
      "installUrl": "https://kasikash.com/app/",
      "applicationCategory": "FinanceApplication",
      "applicationSubCategory": "Stokvel & Lending Management",
      "operatingSystem": "Web, iOS, Android",
      "description": "Money tools for South Africa's stokvels and mashonisa lenders. KasiKash runs contributions, payouts and loans, and turns that saving and repayment track record into a Financial Passport that formal lenders can trust.",
      "image": "https://kasikash.com/og/kasikash-logo-1024.png",
      "screenshot": "https://kasikash.com/og/kasikash-logo-1024.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "ZAR",
        "availability": "https://schema.org/InStock"
      },
      "publisher": {
        "@type": "Organization",
        "name": "KasiKash",
        "url": "https://kasikash.com/"
      },
      "inLanguage": ["en", "zu", "st", "af", "ve"],
      "featureList": [
        "Stokvel contribution and payout tracking",
        "Member management and shared savings goals",
        "Savings, grocery and burial-society groups",
        "Mashonisa loan and borrower management",
        "Loan repayment tracking and history",
        "Financial Passport for community-based credit access",
        "KasiScore credit signal (300-850 scale)",
        "Five SA languages: isiZulu, Sesotho, Afrikaans, English, Tshivenḓa",
        "Works offline; syncs when back online"
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "Stokvel members and community lenders",
        "geographicArea": {
          "@type": "Country",
          "name": "South Africa"
        }
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KasiKash",
      "alternateName": "KasiKash Financial",
      "url": "https://kasikash.com/",
      "logo": "https://kasikash.com/og/kasikash-logo-1024.png",
      "description": "A money app and credit passport for South Africa's stokvels and mashonisa lenders — an evidence-based financial identity for the community money systems the banks can't see.",
      "slogan": "A credit passport for the money the banks can't see.",
      "founder": {
        "@type": "Person",
        "name": "Sinethemba Mvelase",
        "jobTitle": "Founder"
      },
      "foundingLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "ZA"
        }
      },
      "areaServed": {
        "@type": "Country",
        "name": "South Africa"
      },
      "knowsAbout": [
        "Stokvel management",
        "Savings groups and burial societies",
        "Mashonisa and informal lending",
        "Financial inclusion",
        "Alternative credit scoring",
        "Community finance",
        "Multi-language fintech (isiZulu, Sesotho, Afrikaans, Tshivenḓa)"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@kasikash.com",
        "contactType": "Customer Support",
        "availableLanguage": ["en", "zu", "st", "af", "ve"]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is KasiKash?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KasiKash is a money app for South Africa's stokvels and mashonisa lenders that turns contributions, payouts and loan repayments into a credit passport lenders trust."
          }
        },
        {
          "@type": "Question",
          "name": "How does the KasiScore work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The KasiScore is a 300-850 credit signal built transparently from your track record — stokvel contributions paid on time, loan repayments, and other verifiable financial activity. Verified evidence, like a confirmed contribution or repayment, counts far more than anything self-declared, and every factor is explained inside the app."
          }
        },
        {
          "@type": "Question",
          "name": "Is KasiKash free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. KasiKash is free for stokvel members, savings and burial-society groups, and mashonisa lenders. We monetize by offering credit intelligence to lenders — never by charging the people using the app."
          }
        },
        {
          "@type": "Question",
          "name": "Who is KasiKash for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KasiKash is for South Africa's community money systems: stokvel and savings-group members, burial societies, and mashonisa (neighbourhood lenders) — the people who save and lend outside the formal banking system and have never been able to prove that discipline to a bank."
          }
        },
        {
          "@type": "Question",
          "name": "What languages does KasiKash support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "KasiKash supports five South African languages: isiZulu, Sesotho, Afrikaans, English, and Tshivenḓa, so you can run your stokvel or lending book in whichever language feels natural."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data safe with KasiKash?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your records are protected by row-level security so only you and the people in your group can read them. Any bank statements you add are parsed privately, and your Financial Passport belongs to you and is portable across lenders."
          }
        },
        {
          "@type": "Question",
          "name": "Does KasiKash work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Contributions and loan records you capture while offline are queued on your phone and sync automatically the next time you're online. Designed for the reality of intermittent kasi mobile connectivity."
          }
        },
        {
          "@type": "Question",
          "name": "How is KasiKash different from a WhatsApp group or a paper stokvel book?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A WhatsApp group or paper book records who paid — but that record can't be verified or turned into credit. KasiKash keeps the same contributions and loans in a structured, tamper-evident way, then converts that discipline into a credit passport a lender can act on. The trust your stokvel already runs on finally counts toward real financial access."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
