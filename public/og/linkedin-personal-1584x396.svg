<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F0A"/>
      <stop offset="55%" stop-color="#0B3A1F"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <ellipse cx="1250" cy="200" rx="520" ry="260" fill="url(#glow)"/>

  <g fill="#22C55E" opacity="0.09">
    <circle cx="120" cy="80"  r="2"/>
    <circle cx="200" cy="140" r="2"/>
    <circle cx="90"  cy="220" r="2"/>
    <circle cx="260" cy="300" r="2"/>
    <circle cx="340" cy="60"  r="2"/>
    <circle cx="1400" cy="80" r="2"/>
    <circle cx="1500" cy="180" r="2"/>
    <circle cx="1380" cy="320" r="2"/>
  </g>

  <!-- KasiKash app tile -->
  <!-- LinkedIn safe zone: keep avatar area (bottom-left ~250x250 circle) clear -->
  <g transform="translate(430, 108)">
    <rect width="180" height="180" rx="40" fill="url(#tile)"/>
    <text x="90" y="102" text-anchor="middle" dominant-baseline="middle"
          font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
          font-size="118" font-weight="700" fill="#0B0F0A">K</text>
    <circle cx="135" cy="45" r="17" fill="#FBBF24"/>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(650, 152)">
    <text x="0" y="0"
          font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
          font-size="82" font-weight="700" fill="#FFFFFF" letter-spacing="-2">KasiKash</text>
    <text x="0" y="52"
          font-family="'Inter', system-ui, sans-serif"
          font-size="28" font-weight="500" fill="#D1FAE5">
      A credit passport for the businesses banks can't see.
    </text>
    <text x="0" y="96"
          font-family="'Inter', system-ui, sans-serif"
          font-size="16" font-weight="600" fill="#86EFAC" letter-spacing="2.5">
      VOICE-FIRST  •  ISIZULU  •  SESOTHO  •  AFRIKAANS  •  ENGLISH
    </text>
  </g>

  <text x="1540" y="360" text-anchor="end"
        font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="600" fill="#86EFAC">
    kasikash.com
  </text>
</svg>
