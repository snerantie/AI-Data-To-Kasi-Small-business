<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F0A"/>
      <stop offset="55%" stop-color="#0B3A1F"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="191" fill="url(#bg)"/>

  <!-- Ambient green glow -->
  <ellipse cx="950" cy="95" rx="360" ry="180" fill="url(#glow)"/>

  <!-- Subtle grid dots -->
  <g fill="#22C55E" opacity="0.08">
    <circle cx="80"  cy="30"  r="1.5"/>
    <circle cx="120" cy="60"  r="1.5"/>
    <circle cx="60"  cy="120" r="1.5"/>
    <circle cx="180" cy="160" r="1.5"/>
    <circle cx="220" cy="40"  r="1.5"/>
    <circle cx="1050" cy="30" r="1.5"/>
    <circle cx="1080" cy="90" r="1.5"/>
    <circle cx="1000" cy="160" r="1.5"/>
  </g>

  <!-- KasiKash app tile -->
  <g transform="translate(52, 44)">
    <rect width="104" height="104" rx="24" fill="url(#tile)"/>
    <text x="52" y="58" text-anchor="middle" dominant-baseline="middle"
          font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
          font-size="66" font-weight="700" fill="#0B0F0A">K</text>
    <circle cx="78" cy="26" r="10" fill="#FBBF24"/>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(188, 62)">
    <text x="0" y="0"
          font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
          font-size="48" font-weight="700" fill="#FFFFFF"
          letter-spacing="-1">KasiKash</text>
    <text x="0" y="42"
          font-family="'Inter', system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="500" fill="#D1FAE5">
      A credit passport for the businesses banks can't see.
    </text>
    <text x="0" y="72"
          font-family="'Inter', system-ui, -apple-system, sans-serif"
          font-size="14" font-weight="500" fill="#86EFAC" letter-spacing="1.5">
      VOICE-FIRST  •  ISIZULU  •  SESOTHO  •  AFRIKAANS  •  ENGLISH
    </text>
  </g>

  <!-- Right-side badge stack -->
  <g transform="translate(830, 58)" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">
    <g>
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#0B0F0A" stroke="#22C55E" stroke-opacity="0.6"/>
      <text x="59" y="20" text-anchor="middle" fill="#D1FAE5">FINANCIAL PASSPORT</text>
    </g>
    <g transform="translate(130, 0)">
      <rect x="0" y="0" width="90" height="30" rx="15" fill="#0B0F0A" stroke="#22C55E" stroke-opacity="0.6"/>
      <text x="45" y="20" text-anchor="middle" fill="#D1FAE5">KASISCORE</text>
    </g>
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="98" height="30" rx="15" fill="#0B0F0A" stroke="#22C55E" stroke-opacity="0.6"/>
      <text x="49" y="20" text-anchor="middle" fill="#D1FAE5">STOKVEL</text>
    </g>
    <g transform="translate(110, 44)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#0B0F0A" stroke="#22C55E" stroke-opacity="0.6"/>
      <text x="55" y="20" text-anchor="middle" fill="#D1FAE5">SPAZA-READY</text>
    </g>
  </g>

  <!-- Bottom-right URL -->
  <text x="1076" y="175" text-anchor="end"
        font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#86EFAC">
    kasikash.com
  </text>
</svg>
